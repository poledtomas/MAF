[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maf"
dynamic = ["version"]
description = "MAF: Modular Analysis Framework for SMASH-vHLLE simulations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tomas Polednicek" }]
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[project.urls]
Repository = "https://github.com/poledto1/MAF"
Documentation = "https://github.com/poledto1/MAF/tree/main/docs"
Issues = "https://github.com/poledto1/MAF/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
flow = ["scipy>=1.9"]
yaml = ["PyYAML>=6"]
test = ["pytest>=7"]

[project.scripts]
maf = "maf.main:main"

[tool.setuptools.dynamic]
version = { attr = "maf._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
